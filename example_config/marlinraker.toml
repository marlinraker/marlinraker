#include printer.toml

[web]
port = 7125
# Browser origins that may use the API, in addition to pages served from the
# same host as Marlinraker. Patterns without "://" match the hostname only,
# "*" is a wildcard. Use ["*"] to allow every origin (not recommended: any web
# page you visit could then control your printer).
cors_domains = ["*.lan", "*.local", "*://my.mainsail.xyz", "*://app.fluidd.xyz"]

[serial]
port = "auto"
baud_rate = "auto"
max_connection_attempts = 5
connection_timeout = 5000

[misc]
octoprint_compat = true
extended_logs = false
allowed_services = ["marlinraker", "crowsnest", "MoonCord",
    "moonraker-telegram-bot", "KlipperScreen", "sonar", "webcamd"]
